services:
  app:
    image: ghcr.io/febrian1202/sistem-manifest-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - app-public:/var/www/html/public
      - app-storage:/var/www/html/storage
      - app-bootstrap:/var/www/html/bootstrap/cache
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - app
    volumes:
      - ./.docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/febrian1202/sistem-manifest-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    env_file: .env
    command: php artisan horizon
    volumes:
      - app-storage:/var/www/html/storage
      - app-bootstrap:/var/www/html/bootstrap/cache
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cron:
    image: ghcr.io/febrian1202/sistem-manifest-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    env_file: .env
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    volumes:
      - app-storage:/var/www/html/storage
      - app-bootstrap:/var/www/html/bootstrap/cache
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-public:
  app-storage:
  app-bootstrap:

networks:
  dokploy-network:
    external: true
